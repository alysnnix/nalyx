<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>omp chats</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <header>
          <h1>omp chats</h1>
          <button id="refresh" title="Recarregar">⟳</button>
        </header>
        <input id="filter" type="search" placeholder="filtrar…" autocomplete="off" />
        <ul id="sessions"></ul>
      </aside>
      <main id="main">
        <div id="topbar">
          <button id="back" title="Voltar">‹</button>
          <div id="title">selecione um chat</div>
          <div id="cwd"></div>
        </div>
        <div id="transcript"></div>
        <form id="composer">
          <textarea id="input" rows="1" placeholder="continuar a conversa…" disabled></textarea>
          <button id="send" type="submit" disabled>enviar</button>
          <button id="stop" type="button" hidden>parar</button>
        </form>
      </main>
    </div>
    <script src="app.js" type="module"></script>
  </body>
</html>
