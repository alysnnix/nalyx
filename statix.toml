# Read by the statix pre-commit hook (flake.nix). The ignore list lives here
# because the hook's `settings.ignore` renders `--ignore a b c`, which statix
# 0.5.8 rejects: it takes one value per flag.
ignore = ["hosts/*/hardware-configuration.nix"]

# Lints statix gained after the tree was written. Disabled rather than fixed
# so the hook runs again; drop an entry once its warnings are cleaned up.
disabled = [
  "repeated_keys",
  "manual_inherit_from",
  "useless_parens",
]
